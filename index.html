<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frecuencia - Juego de Mesa</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="app">
    <!-- Encabezado con Marcador Doble -->
    <header>
      <h1>FRECUENCIA</h1>
      <div id="score-board">
        <div class="team-score active" id="score-team1">
          <span id="name-display-1">Equipo 1</span>
          <strong id="score-val-1">0 pts</strong>
        </div>
        <div class="team-score" id="score-team2">
          <span id="name-display-2">Equipo 2</span>
          <strong id="score-val-2">0 pts</strong>
        </div>
      </div>
    </header>

    <!-- PANTALLA 0: Registro de Equipos -->
    <section id="screen-setup-teams" class="screen">
      <h2>Configuración de la Partida</h2>
      <p class="subtitle">Introduce el nombre de los jugadores o equipos:</p>
      
      <div class="input-group">
        <label for="input-team1">Equipo / Jugador 1:</label>
        <input type="text" id="input-team1" value="Equipo Rojo" placeholder="Ej. Equipo Rojo">
      </div>

      <div class="input-group">
        <label for="input-team2">Equipo / Jugador 2:</label>
        <input type="text" id="input-team2" value="Equipo Azul" placeholder="Ej. Equipo Azul">
      </div>

      <button id="btn-start-game" class="btn">Comenzar Partida</button>
    </section>

    <!-- PANTALLA 1: Inicio de Ronda / Selección de Carta -->
    <section id="screen-setup" class="screen hidden">
      <h2 id="turn-announcement">Turno de: Equipo Rojo</h2>

      <!-- Opciones para sacar carta -->
      <div class="button-group">
        <button id="btn-draw-card" class="btn">Carta Aleatoria</button>
        <button id="btn-custom-card-toggle" class="btn btn-secondary">Crear Carta Personalizada</button>
      </div>

      <!-- Formulario para carta personalizada -->
      <div id="custom-card-form" class="custom-form hidden">
        <div class="input-group">
          <input type="text" id="custom-left" placeholder="Extremo Izquierdo (Ej. Frío)">
        </div>
        <div class="input-group">
          <input type="text" id="custom-right" placeholder="Extremo Derecho (Ej. Caliente)">
        </div>
        <button id="btn-save-custom-card" class="btn">Usar esta Carta</button>
      </div>

      <!-- Visualizador de la Carta Seleccionada -->
      <div id="card-container" class="card hidden">
        <span id="left-concept" class="concept">Frío</span>
        <span class="vs">vs</span>
        <span id="right-concept" class="concept">Caliente</span>
      </div>

      <button id="btn-start-turn" class="btn hidden">Soy el Psíquico (Ver Objetivo)</button>
    </section>

    <!-- PANTALLA 2: Tablero del Juego (Ruleta) -->
    <section id="screen-game" class="screen hidden">
      <div class="concepts-bar">
        <span id="game-left-concept">Frío</span>
        <span id="game-right-concept">Caliente</span>
      </div>

      <div id="dial-container">
        <div id="dial">
          <div id="dial-scale" class="dial-scale"></div>
          <div id="target-zone" class="hidden"></div>
          <div id="pointer"></div>
          <div class="center-knob"></div>
        </div>
      </div>

      <div id="controls">
        <p id="instruction-text">El Psíquico ve la zona objetivo y da una pista.</p>
        <button id="btn-hide-target" class="btn">Cerrar Tapa y Pasar Móvil</button>
        <button id="btn-submit-guess" class="btn hidden">Confirmar Posición</button>
        <button id="btn-reveal" class="btn hidden">Revelar Resultado</button>
      </div>
    </section>

  </div>

  <script src="js/cards.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
